name: Android APK

on:
  push:
    branches: [main]
    paths:
      - "native-android/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build release APK
        working-directory: native-android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -o pipefail
          echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore
          gradle assembleRelease -PversionCode=${{ github.run_number }} -PversionName=1.${{ github.run_number }} --stacktrace --console=plain 2>&1 | tee build.log

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: native-android/build.log
          if-no-files-found: warn

      - name: Publish build log to repo on failure
        if: failure()
        run: |
          cp native-android/build.log build-error.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build-error.log
          git commit -m "chore: publish android build log [skip ci]" || true
          git push origin HEAD:main || true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd native-android/app/build/outputs/apk/release
          cp app-release.apk dopamine-paradise.apk
          gh release create "v${{ github.run_number }}" dopamine-paradise.apk \
            --title "Dopamin Paradise 1.${{ github.run_number }}" \
            --notes "Automatischer Build" || \
          gh release upload "v${{ github.run_number }}" dopamine-paradise.apk --clobber

      - name: Publish version.json
        run: |
          cat > version.json <<EOF
          {"versionCode": ${{ github.run_number }}, "versionName": "1.${{ github.run_number }}", "apkUrl": "https://github.com/soosder/habit/releases/latest/download/dopamine-paradise.apk", "publishedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"}
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json
          git commit -m "chore: bump app version [skip ci]" || true
          git push origin HEAD:main || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dopamine-paradise-apk
          path: native-android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
